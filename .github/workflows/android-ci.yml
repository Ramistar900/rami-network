name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish experimental APK as a draft GitHub Release
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rami-network-pr-${{ github.event.pull_request.number }}
          name: RAMI NETWORK Test Build PR #${{ github.event.pull_request.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          draft: true
          prerelease: true
          overwrite_files: true
          body: |
            Experimental RAMI NETWORK debug build for owner testing.
            This is not a production-signed release.
            Source commit: ${{ github.event.pull_request.head.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
